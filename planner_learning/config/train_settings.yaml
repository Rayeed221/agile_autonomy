log_dir: '/tmp/agile_autonomy_final_model'
quad_name: 'none'
odometry_topic: 'ground_truth/odometry'
rgb_topic: 'agile_autonomy/unity_rgb'
depth_topic: 'agile_autonomy/sgm_depth'
use_rgb: False # Use depth images only (matches physical sensor setup)
use_depth: True # Depth from stereo SGM
state_dim: 3 # x,y,z positions
out_seq_len: 10 # 10 future waypoints (1s horizon at 10Hz)
predict_state_number: []
seq_len: 1 # Single depth frame per inference
poly_coeff: 3
img_width: 224
img_height: 224
future_time: 5.0 # Look 5s ahead along reference trajectory
modes: 3 # 3-mode mixture for multimodal trajectory distribution
checkpoint:
  resume_training: False
  resume_file: ""
train:
  max_training_epochs: 100
  batch_size: 8
  freeze_backbone: True  # ImageNet MobileNet features are already strong
  top_trajectories: 3
  summary_freq: 500
  data_save_freq: 15
  train_dir: "data/train"
  val_dir: "data/val"
  log_images: False
  save_every_n_epochs: 10
  ref_frame: 'bf'  # Body frame predictions for onboard control
  track_global_traj: False
inputs:
  position: False
  attitude: True   # Attitude (rotation matrix) for body-frame transforms
  bodyrates: True  # Angular rates for dynamic prediction
  velocity_frame: 'bf'
